name: Atualizar perfil

on:
  schedule:
    - cron: '0 6 * * 1' # toda segunda, 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate.mjs
      - .github/workflows/update-profile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar SVGs
        run: node scripts/generate.mjs
        env:
          # Opcional: crie o secret PROFILE_TOKEN (PAT com read:user) para contar contribuições privadas.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: atualiza graficos do perfil"
          git push
